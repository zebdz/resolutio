name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      deploy_dir:
        required: true
        type: string
      site_url:
        required: true
        type: string
      port:
        required: true
        type: string

permissions:
  contents: write

jobs:
  backup-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create backup branch
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP_BRANCH="backups/${BRANCH}/${TIMESTAMP}"
          echo "Creating backup branch: ${BACKUP_BRANCH}"
          git checkout -b "${BACKUP_BRANCH}"
          git push origin "${BACKUP_BRANCH}"

  cleanup-old-backups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete backup branches older than 30 days
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          CUTOFF=$(date -u -d '30 days ago' +%Y%m%dT%H%M%SZ)
          PREFIX="backups/${BRANCH}/"

          echo "Cleaning up backups older than ${CUTOFF} under ${PREFIX}"

          git ls-remote --heads origin "refs/heads/${PREFIX}*" | while read sha ref; do
            BRANCH_NAME="${ref#refs/heads/}"
            TIMESTAMP="${BRANCH_NAME#${PREFIX}}"

            if [[ "${TIMESTAMP}" < "${CUTOFF}" ]]; then
              echo "Deleting old backup: ${BRANCH_NAME}"
              git push origin --delete "${BRANCH_NAME}"
            else
              echo "Keeping: ${BRANCH_NAME}"
            fi
          done

  deploy:
    needs: [backup-branch, cleanup-old-backups]
    runs-on: ubuntu-latest

    env:
      SERVER_USER: www-root
      SERVER_IP: 89.111.155.217
      DEPLOY_DIR: ${{ inputs.deploy_dir }}
      SITE_URL: ${{ inputs.site_url }}
      PORT: ${{ inputs.port }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.12.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets[inputs.branch == 'beta' && 'DATABASE_URL_BETA' || 'DATABASE_URL'] }}
        run: yarn prisma generate

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build application
        env:
          DATABASE_URL: ${{ secrets[inputs.branch == 'beta' && 'DATABASE_URL_BETA' || 'DATABASE_URL'] }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ inputs.site_url }}
          NEXT_PUBLIC_API_URL: ${{ inputs.site_url }}
          ANCHOR_PROVIDER: opentimestamps
          ANCHOR_POLLER_SECRET: ${{ secrets[inputs.branch == 'beta' && 'ANCHOR_POLLER_SECRET_BETA' || 'ANCHOR_POLLER_SECRET'] }}
        run: |
          yarn build
          yarn build:receipt-backfill
          yarn build:seal-verifier

      - name: Create deployment package
        env:
          DATABASE_URL: ${{ secrets[inputs.branch == 'beta' && 'DATABASE_URL_BETA' || 'DATABASE_URL'] }}
          ANCHOR_POLLER_SECRET: ${{ secrets[inputs.branch == 'beta' && 'ANCHOR_POLLER_SECRET_BETA' || 'ANCHOR_POLLER_SECRET'] }}
          OTS_CALENDAR_URLS: ${{ vars.OTS_CALENDAR_URLS }}
          OTS_ESPLORA_URL: ${{ vars.OTS_ESPLORA_URL }}
          OTS_TIMEOUT_MS: ${{ vars.OTS_TIMEOUT_MS }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          OTP_CODE_SECRET: ${{ secrets.OTP_CODE_SECRET }}
          OTP_EXPIRY_MINUTES: ${{ vars.OTP_EXPIRY_MINUTES || '10' }}
          OTP_MAX_ATTEMPTS: ${{ vars.OTP_MAX_ATTEMPTS || '5' }}
          SMS_RU_API_ID: ${{ secrets.SMS_RU_API_ID }}
          SMS_RU_TEST_MODE: ${{ inputs.branch == 'beta' && 'true' || 'false' }}
          SMS_RU_MAX_COST_RUBLES: ${{ vars.SMS_RU_MAX_COST_RUBLES || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_GENERATIVE_AI_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_KEY }}
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          PORT: ${{ inputs.port }}
        run: |
          set -eu
          umask 077
          : "${DATABASE_URL:?}" "${ANCHOR_POLLER_SECRET:?}"
          runtime_env=$(mktemp)
          trap 'rm -f "$runtime_env"' EXIT
          for name in DATABASE_URL ANCHOR_POLLER_SECRET TURNSTILE_SECRET_KEY OTP_CODE_SECRET OTP_EXPIRY_MINUTES OTP_MAX_ATTEMPTS SMS_RU_API_ID SMS_RU_TEST_MODE SMS_RU_MAX_COST_RUBLES DEEPSEEK_API_KEY GOOGLE_GENERATIVE_AI_KEY DADATA_API_KEY SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASSWORD SMTP_FROM PORT; do
            printf '%s=%s\n' "$name" "${!name}" >> "$runtime_env"
          done
          printf 'ANCHOR_PROVIDER=opentimestamps\nNEXT_PUBLIC_API_URL=%s\n' "$SITE_URL" >> "$runtime_env"
          for name in OTS_CALENDAR_URLS OTS_ESPLORA_URL OTS_TIMEOUT_MS; do
            if [[ -n "${!name}" ]]; then printf '%s=%s\n' "$name" "${!name}" >> "$runtime_env"; fi
          done
          ./create-deploy-package.sh "$runtime_env"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          MIGRATION_DATABASE_URL: ${{ secrets[inputs.branch == 'beta' && 'MIGRATION_DATABASE_URL_BETA' || 'MIGRATION_DATABASE_URL'] }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        run: |
          set -eu
          : "${MIGRATION_DATABASE_URL:?}"
          target="$SERVER_USER@$SERVER_IP"
          remote_archive=$(ssh -i ~/.ssh/id_ed25519 "$target" 'umask 077 && mktemp /tmp/resolutio-release.XXXXXXXX')
          [[ "$remote_archive" =~ ^/tmp/resolutio-release\.[[:alnum:]]+$ ]]
          trap 'ssh -i ~/.ssh/id_ed25519 "$target" "rm -f $remote_archive"' EXIT
          scp -i ~/.ssh/id_ed25519 deploy.tar.gz "$target:$remote_archive"
          ssh -i ~/.ssh/id_ed25519 "$target" "cd '$DEPLOY_DIR' && tar -xzf '$remote_archive' deploy-on-server.sh && ./deploy-on-server.sh '$remote_archive'" <<< "$MIGRATION_DATABASE_URL"

      - name: Check public login page and browser assets
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/check-deployed-assets.py "$SITE_URL"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
